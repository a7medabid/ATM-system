<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ATM - Enter User ID</title>
    <link rel="stylesheet" href="admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="atm-rectangular-casing">
        <div class="atm-interface">
            <div class="atm-screen-rectangular">
                <header class="screen-header">
                    <div class="bank-logo">🏛️ <span>بنك مصر</span></div>
                </header>
                <main class="userid-main">
                    <h1 class="title">برجاء إدخال رقم الحساب (User ID)</h1>
                    <div class="input-box"><span class="input-val">_ _ _ _</span></div>
                    <div class="keypad">
                        <button class="n-btn">1</button><button class="n-btn">2</button><button class="n-btn">3</button>
                        <button class="n-btn">4</button><button class="n-btn">5</button><button class="n-btn">6</button>
                        <button class="n-btn">7</button><button class="n-btn">8</button><button class="n-btn">9</button>
                        <button class="n-btn del">مسح</button><button class="n-btn">0</button><button class="n-btn confirm">تأكيد</button>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
