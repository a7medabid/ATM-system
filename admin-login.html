<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ATM - Admin Login</title>
    <link rel="stylesheet" href="admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="atm-rectangular-casing">
        <div class="atm-interface">
            <div class="atm-screen-rectangular">
                <main class="admin-main">
                    <div class="admin-icon">⚙️</div>
                    <h1 class="title">نظام الإدارة: أدخل الرقم السري</h1>
                    <div class="pin-display">
                        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                    </div>
                    <div class="keypad">
                        <button class="n-btn">1</button><button class="n-btn">2</button><button class="n-btn">3</button>
                        <button class="n-btn">4</button><button class="n-btn">5</button><button class="n-btn">6</button>
                        <button class="n-btn">7</button><button class="n-btn">8</button><button class="n-btn">9</button>
                        <button class="n-btn del">مسح</button><button class="n-btn">0</button><button class="n-btn confirm">دخول</button>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
