<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ATM - Admin Dashboard</title>
    <link rel="stylesheet" href="admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="atm-rectangular-casing">
        <div class="atm-interface">
            <div class="atm-screen-rectangular">
                <header class="dash-header">
                    <h2>لوحة تحكم النظام (Admin)</h2>
                    <button class="logout-btn" id="admin-logout">تسجيل خروج</button>
                </header>
                
                <main class="dash-content">
                    <div class="admin-panel">
                        <h3 class="panel-title">➕ إضافة حساب جديد</h3>
                        <div class="form-grid">
                            <input type="text" id="new-acc-id" placeholder="رقم الحساب (ID)" class="admin-input">
                            <input type="password" id="new-acc-pin" placeholder="الالرقم السري" class="admin-input">
                            <input type="number" id="new-acc-balance" placeholder="الرصيد الافتتاحي" class="admin-input">
                            <select id="new-acc-type" class="admin-input">
                                <option value="1">جاري (Checking)</option>
                                <option value="2">توفير (Savings)</option>
                            </select>
                        </div>
                        <button class="submit-btn green" id="add-acc-btn">إنشاء الحساب</button>
                    </div>

                    <div class="admin-panel">
                        <h3 class="panel-title">🗑️ حذف حساب</h3>
                        <div class="form-grid single">
                            <input type="text" id="del-acc-id" placeholder="رقم الحساب المراد حذفه" class="admin-input">
                        </div>
                        <button class="submit-btn red" id="del-acc-btn">حذف الحساب</button>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
