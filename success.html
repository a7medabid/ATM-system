<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ATM - Success</title>
    <link rel="stylesheet" href="success-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="atm-rectangular-casing">
        <div class="atm-interface">
            <div class="atm-screen-rectangular">

                    <div class="check-icon">✔️</div>
                    <h1 class="msg">تمت العملية بنجاح!</h1>
                    <p class="sub-msg">برجاء سحب البطاقة واستلام النقدية</p>
                    <button class="exit-btn">خروج</button>
                </main>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
