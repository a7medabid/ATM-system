<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ATM - Balance Inquiry</title>
    <link rel="stylesheet" href="balance-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="atm-rectangular-casing">
        <div class="atm-interface">
            <div class="atm-screen-rectangular">
                <header class="screen-header">
                    <div class="bank-logo">🏛️ <span>بنك مصر</span></div>
                    <div class="date-time">12 أبريل 2026</div>
                </header>
                <main class="balance-content">
                    <h1 class="title">رصيدك الحالي</h1>
                    <div class="balance-card">
                        <span class="amount">5,750.00</span>
                        <span class="currency">جنيه مصري</span>
                    </div>
                    <div class="options-container">
                        <button class="action-btn gold-btn">طباعة إيصال</button>
                        <button class="action-btn outline-btn">العودة للقائمة</button>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
